<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Builder Portal | Raytown Construction: Trade N Build</title>
    
    <link rel="icon" type="image/png" href="assets/images/raytown_trade_build_logo.png">
    
    <style>
        :root {
            --bg-dark: #0f1f3d;
            --accent-cyan: #00f2ff;
            --text-glowing: #00e0ed;
            --metal-shine: rgba(255,255,255,0.25);
            --metal-shadow: rgba(0,0,0,0.6);
            --metal-texture: url('https://www.transparenttextures.com/patterns/brushed-alum.png');
            --accent-gold: #d6a048;
        }

        body {
            font-family: 'Montserrat', 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-dark);
            background-image: url('assets/images/lowpoly_space_background.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: white;
            margin: 0; padding: 0;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh;
        }

        /* --- Header --- */
        header { width: 100%; box-sizing: border-box; background-color: rgba(15, 31, 61, 0.98); padding: 1rem 5%; border-bottom: 2px solid #4b5563; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .header-logo { display: flex; align-items: center; gap: 12px; }
        .logo-icon { width: 40px; height: 40px; }
        header h1 { margin: 0; font-size: 1.4rem; color: #e2e8f0; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
        .nav-links a { color: #e2e8f0; text-decoration: none; margin-left: 1.5rem; transition: color 0.3s; font-size: 0.85rem; text-transform: uppercase; }
        .nav-links a:hover { color: var(--accent-gold); }

        /* --- SECURITY GATE (THE LOCK SCREEN) --- */
        #security-gate {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            flex-grow: 1;
            text-align: center;
            padding: 2rem;
            width: 100%;
            z-index: 500;
        }

        .lock-icon { font-size: 4rem; margin-bottom: 1rem; color: var(--accent-cyan); text-shadow: 0 0 20px rgba(0, 242, 255, 0.4); }
        
        .security-box {
            background-color: rgba(18, 30, 60, 0.95);
            border: 2px solid var(--accent-cyan);
            border-radius: 8px;
            padding: 3rem;
            max-width: 500px;
            box-shadow: 0 10px 40px rgba(0, 242, 255, 0.3), inset 0 0 15px rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
        }

        .security-box h2 { color: #fff; margin-top: 0; font-size: 2rem; text-transform: uppercase; letter-spacing: 2px; }
        .security-box p { color: #94a3b8; margin-bottom: 2rem; font-size: 1.1rem; }

        .passcode-input {
            width: 100%;
            padding: 1rem;
            font-size: 1.5rem;
            text-align: center;
            background-color: #070d18;
            border: 2px solid #2e4d82;
            color: var(--text-glowing);
            border-radius: 4px;
            margin-bottom: 1.5rem;
            box-sizing: border-box;
            letter-spacing: 5px;
            text-transform: uppercase;
            outline: none;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }
        .passcode-input:focus { border-color: var(--accent-cyan); box-shadow: 0 0 15px rgba(0, 242, 255, 0.3); }

        .verify-btn {
            background: linear-gradient(to bottom, #7da1d1 0%, #1e5ba9 48%, #164687 52%, #2a6fcc 100%);
            color: white;
            border: 2px solid #4a6da7;
            padding: 1rem 2rem;
            font-size: 1.2rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .verify-btn:hover { box-shadow: 0 0 15px var(--accent-cyan); filter: brightness(1.1); transform: translateY(-2px); }

        .error-msg { color: #ff6b6b; margin-top: 1rem; font-weight: bold; display: none; text-transform: uppercase; letter-spacing: 1px; }

        /* --- ACTUAL PORTAL CONTENT --- */
        #portal-content {
            display: none; 
            width: 100%;
            flex-grow: 1;
        }

        .logout-bar { text-align: right; padding: 1rem 5%; width: 100%; box-sizing: border-box; }
        .logout-btn { background: transparent; border: 1px solid #4b5563; color: #94a3b8; padding: 0.5rem 1rem; cursor: pointer; border-radius: 4px; text-transform: uppercase; font-size: 0.8rem; transition: 0.3s; }
        .logout-btn:hover { border-color: var(--accent-cyan); color: var(--accent-cyan); }

        /* --- Calculator Frame --- */
        .calculator-frame {
            width: 440px;
            background: linear-gradient(135deg, #abb1b8 0%, #d1d9e6 45%, #e1e9f6 55%, #c0c6d0 100%);
            border: 4px solid #a4adb8;
            border-radius: 20px 20px 40px 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8), inset 0 3px 6px rgba(255,255,255,0.6);
            position: relative;
            padding: 20px;
            margin: 1rem auto 3rem auto;
            z-index: 10;
        }

        .grid-panel {
            background-color: #121e3c;
            border-radius: 10px;
            border: 2px solid #3c5483;
            padding: 15px;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.7);
        }

        .brand-bar {
            background: linear-gradient(to right, #203e7c, #0d1e41, #203e7c);
            color: #d6eaff; text-align: center; padding: 8px; border-radius: 6px;
            font-size: 0.7rem; text-transform: uppercase; letter-spacing: 2px; font-weight: bold;
            border: 1px solid #4a6da7; margin-bottom: 15px;
        }

        .display-node {
            background: linear-gradient(135deg, #d4dbe4 0%, #e8eef6 50%, #ccd3de 100%);
            border-radius: 8px; border: 1px solid #7d858f; padding: 12px;
            position: relative; box-shadow: 0 4px 8px rgba(0,0,0,0.3), inset 0 2px 2px rgba(255,255,255,0.7);
            margin-bottom: 10px;
        }

        .data-input {
            width: 100%; box-sizing: border-box; background: #070d18;
            border: 2px solid #2e4d82; border-radius: 6px;
            color: var(--text-glowing); font-size: 1.4rem; font-weight: 900;
            text-align: center; padding: 8px 0; outline: none;
        }

        #results-display { margin-top: 15px; background: rgba(0, 242, 255, 0.05); border: 1px solid var(--accent-cyan); border-radius: 8px; padding: 15px; display: none; text-align: center; }

        footer { text-align: center; padding: 2rem; color: #94a3b8; font-size: 0.8rem; border-top: 1px solid #4b5563; background: rgba(15, 31, 61, 0.9); width: 100%; margin-top: auto;}
    </style>
</head>
<body>

    <header>
        <div class="header-logo">
            <img src="https://reshaud1730.github.io/raytown-construction/assets/images/raytown_trade_build_logo.png" alt="Logo" class="logo-icon">
            <h1>RAYTOWN CONSTRUCTION</h1>
        </div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="insights.html">Insights</a>
            <a href="portal.html" style="color: var(--accent-gold);">Builder Portal</a>
            <a href="https://discord.gg/2xD54YpqP" target="_blank">Discord</a>
        </div>
    </header>

    <div id="security-gate">
        <div class="lock-icon">🛡️</div>
        <div class="security-box">
            <h2>Terminal Locked</h2>
            <p>Authorized FastTrack Builders Only.</p>
            
            <input type="password" id="passcode" class="passcode-input" placeholder="PASSCODE" onkeypress="handleKeyPress(event)">
            <button class="verify-btn" onclick="verifyCode()">Initialize Access</button>
            
            <div id="error-msg" class="error-msg">❌ ACCESS DENIED</div>
            
            <div style="margin-top: 2rem; font-size: 0.85rem; color: #94a3b8;">
                Code available in the <a href="https://discord.gg/2xD54YpqP" target="_blank" style="color: var(--accent-cyan);">Discord Server</a>.
            </div>
        </div>
    </div>

    <div id="portal-content">
        <div class="logout-bar">
            <button onclick="lockPortal()" class="logout-btn">Lock Terminal</button>
        </div>

        <div class="calculator-frame">
            <div class="grid-panel">
                <div class="brand-bar">RTC BUILDER CONSOLE v2.0</div>

                <div class="display-node">
                    <label style="color:#0f1f3d; font-size:0.6rem; font-weight:bold; text-transform:uppercase;">Total Project SH</label>
                    <input type="number" id="total_req" class="data-input" placeholder="0000">
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <div class="display-node">
                        <label style="color:#0f1f3d; font-size:0.6rem; font-weight:bold;">DAYS LEFT</label>
                        <input type="number" id="days_left" class="data-input" placeholder="0">
                    </div>
                    <div class="display-node">
                        <label style="color:#0f1f3d; font-size:0.6rem; font-weight:bold;">HOURS LEFT</label>
                        <input type="number" id="hours_left" class="data-input" placeholder="0">
                    </div>
                </div>

                <div class="display-node">
                    <label style="color:#0f1f3d; font-size:0.6rem; font-weight:bold;">STAKED SPARKLET</label>
                    <input type="number" id="staked_spark" step="0.01" class="data-input" placeholder="1.00">
                </div>

                <button class="verify-btn" onclick="runRTCReverse()">RUN PROGRESS ANALYSIS</button>

                <div id="results-display">
                    <span style="color: #a1b8d5; font-size: 0.7rem; text-transform: uppercase;">Completed Spark Hours</span>
                    <span id="res_completed" style="color: var(--accent-cyan); font-size: 2rem; font-weight: 900; display: block;">0.00</span>
                </div>
            </div> 
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Raytown Construction | Powered by FASTTRACK TOOLs</p>
    </footer>

    <script>
        const SECRET_CODE = "TNB2030";
        const SESSION_KEY = "rtc_terminal_active_2030"; // Unique key to force re-entry

        // Check session on load
        window.onload = function() {
            if (sessionStorage.getItem(SESSION_KEY) === "granted") {
                unlockPortal();
            }
        };

        function verifyCode() {
            const userInput = document.getElementById('passcode').value.trim().toUpperCase();
            if (userInput === SECRET_CODE) {
                sessionStorage.setItem(SESSION_KEY, "granted");
                unlockPortal();
            } else {
                const err = document.getElementById('error-msg');
                err.style.display = "block";
                document.getElementById('passcode').value = "";
                // Shake effect
                const gate = document.getElementById('security-gate');
                gate.style.transform = "translateX(-10px)";
                setTimeout(() => gate.style.transform = "translateX(10px)", 100);
                setTimeout(() => gate.style.transform = "translateX(0)", 200);
            }
        }

        function unlockPortal() {
            document.getElementById('security-gate').style.display = "none";
            document.getElementById('portal-content').style.display = "block";
        }

        function lockPortal() {
            sessionStorage.removeItem(SESSION_KEY);
            location.reload(); // Force hard reset
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') verifyCode();
        }

        function runRTCReverse() {
            const total = parseFloat(document.getElementById('total_req').value);
            const d = parseFloat(document.getElementById('days_left').value) || 0;
            const h = parseFloat(document.getElementById('hours_left').value) || 0;
            const sparklet = parseFloat(document.getElementById('staked_spark').value);

            if (total > 0 && sparklet > 0) {
                const trueSpark = sparklet / 1000;
                const remSH = ((d * 24) + h) * trueSpark;
                const completed = total - remSH;
                document.getElementById('res_completed').innerText = completed.toFixed(2);
                document.getElementById('results-display').style.display = 'block';
            }
        }
    </script>
</body>
</html>
