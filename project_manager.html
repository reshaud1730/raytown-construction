<html lang="en">
<head>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;700&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif; 
            background: #0f172a;
            background-image: 
                radial-gradient(circle at 0% 0%, rgba(30, 41, 59, 0.5) 0, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(30, 41, 59, 0.5) 0, transparent 50%),
                url('assets/images/FTPMbanner1.png');
            background-repeat: no-repeat;
            background-position: center top;
            background-size: cover;
            background-attachment: fixed;
            min-height: 100vh;
            color: #f8fafc;
        }

        .page-overlay {
            background: rgba(15, 23, 42, 0.88);
            min-height: 100vh;
        }

        .racing-font {
            font-family: 'Oswald', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #0f172a;
        }

        .sidebar-item-active {
            background: rgba(59, 130, 246, 0.2);
            border-left: 4px solid #3b82f6;
            color: #fff !important;
        }

        input:focus {
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.4);
        }

        .custom-scroll::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }
    </style>
</head>
