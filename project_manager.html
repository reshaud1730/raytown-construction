<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastTrack Project Manager | Powered by FastTrack Tools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;700&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif; 
            background: #0f172a;
            background-image: 
                radial-gradient(circle at 0% 0%, rgba(30, 41, 59, 0.5) 0, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(30, 41, 59, 0.5) 0, transparent 50%),
                url('assets/images/FTPMbanner1.png');
            background-repeat: no-repeat;
            background-position: center top;
            background-size: cover;
            background-attachment: fixed;
            min-height: 100vh;
            color: #f8fafc;
        }

        .page-overlay {
            background: rgba(15, 23, 42, 0.88);
            min-height: 100vh;
        }

        .racing-font {
            font-family: 'Oswald', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #0f172a;
        }

        .sidebar-item-active {
            background: rgba(59, 130, 246, 0.2);
            border-left: 4px solid #3b82f6;
            color: #fff !important;
        }

        input:focus {
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.4);
        }

        .custom-scroll::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const ICON_PATHS = {
            plus: <path d="M12 5V19M5 12H19" stroke="currentColor" strokeWidth="2" />,
            trash: <path d="M3 6H5H21M19 6V20C19 21.1046 18.1046 22 17 22H7C5.89543 22 5 21.1046 5 20V6M8 6V4C8 2.89543 8.89543 2 10 2H14C15.1046 2 16 2.89543 16 4V6" stroke="currentColor" strokeWidth="2" fill="none" />,
            edit: <path d="M11 4H4C2.89543 4 2 4.89543 2 6V20C2 21.1046 2.89543 22 4 22H18C19.1046 22 20 21.1046 20 20V13M18.5 2.5C19.3284 1.67157 20.6716 1.67157 21.5 2.5C22.3284 3.32843 22.3284 4.67157 21.5 5.5L12 15L8 16L9 12L18.5 2.5Z" stroke="currentColor" strokeWidth="2" fill="none" />,
            reset: <path d="M1 4V10H7M23 20V14H17M20.49 9A9 9 0 0 0 5.64 5.64L1 10M23 14L18.36 18.36A9 9 0 0 1 3.51 15" stroke="currentColor" strokeWidth="2" fill="none" />,
            info: (
                <React.Fragment>
                    <circle cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="2" fill="none" />
                    <path d="M12 16V12M12 8H12.01" stroke="currentColor" strokeWidth="2" />
                </React.Fragment>
            ),
            coins: (
                <React.Fragment>
                    <circle cx="8" cy="8" r="6" stroke="currentColor" strokeWidth="2" fill="none" />
                    <circle cx="16" cy="16" r="6" stroke="currentColor" strokeWidth="2" fill="none" />
                </React.Fragment>
            ),
            users: <path d="M17 21V19C17 16.7909 15.2091 15 13 15H5C2.79086 15 1 16.7909 1 19V21M7 11C9.20914 11 11 9.20914 11 7C11 4.79086 9.20914 3 7 3C4.79086 3 3 4.79086 3 7C3 9.20914 4.79086 11 7 11ZM23 21V19C23 17.1662 21.7587 15.622 20.0704 15.118M18 3.13036C19.7214 3.57591 21 5.13803 21 7C21 8.86197 19.7214 10.4241 18 10.8696" stroke="currentColor" strokeWidth="2" fill="none" />,
            folder: <path d="M22 19C22 20.1046 21.1046 21 20 21H4C2.89543 21 2 20.1046 2 19V5C2 3.89543 2.89543 3 4 3H9L11 5H20C21.1046 5 22 5.89543 22 7V19Z" stroke="currentColor" strokeWidth="2" fill="none" />
        };

        const Icon = ({ name, className = "w-5 h-5" }) => {
            const path = ICON_PATHS[name];
            return (
                <svg viewBox="0 0 24 24" className={className} strokeLinecap="round" strokeLinejoin="round" fill="none">
                    {path || <circle cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="2" />}
                </svg>
            );
        };

        const App = () => {
            const [projects, setProjects] = useState(() => {
                return [{
                    id: Date.now(),
                    name: "Alpha Build - Main",
                    buildCostHours: 1000,
                    upxPerHour: 30,
                    stakers: [{ id: 1, name: 'Lead Racer', sparklet: 1000, days: 7, hours: 0 }]
                }];
            });
            const [activeProjectId, setActiveProjectId] = useState(projects[0].id);

            const activeProject = projects.find(p => p.id === activeProjectId) || projects[0];

            const addProject = () => {
                const newProject = {
                    id: Date.now(),
                    name: `New Project ${projects.length + 1}`,
                    buildCostHours: 1000,
                    upxPerHour: 30,
                    stakers: []
                };
                setProjects([...projects, newProject]);
                setActiveProjectId(newProject.id);
            };

            const removeProject = (id, e) => {
                e.stopPropagation();
                if (projects.length === 1) return;
                const updated = projects.filter(p => p.id !== id);
                setProjects(updated);
                if (activeProjectId === id) setActiveProjectId(updated[0].id);
            };

            const updateProjectMeta = (id, field, value) => {
                setProjects(projects.map(p => p.id === id ? { ...p, [field]: value } : p));
            };

            const addStaker = () => {
                const newId = activeProject.stakers.length > 0 ? Math.max(...activeProject.stakers.map(s => s.id)) + 1 : 1;
                const updatedStakers = [...activeProject.stakers, { id: newId, name: `Pilot ${newId}`, sparklet: 0, days: 0, hours: 0 }];
                updateProjectMeta(activeProjectId, 'stakers', updatedStakers);
            };

            const removeStaker = (stakerId) => {
                const updatedStakers = activeProject.stakers.filter(s => s.id !== stakerId);
                updateProjectMeta(activeProjectId, 'stakers', updatedStakers);
            };

            const resetStakerTime = (stakerId) => {
                const updatedStakers = activeProject.stakers.map(s => 
                    s.id === stakerId ? { ...s, days: 0, hours: 0 } : s
                );
                updateProjectMeta(activeProjectId, 'stakers', updatedStakers);
            };

            const clearAllStakers = () => {
                updateProjectMeta(activeProjectId, 'stakers', []);
            };

            const resetAllStakerTimes = () => {
                const updatedStakers = activeProject.stakers.map(s => ({ ...s, days: 0, hours: 0 }));
                updateProjectMeta(activeProjectId, 'stakers', updatedStakers);
            };

            const updateStaker = (stakerId, field, value) => {
                const updatedStakers = activeProject.stakers.map(s => 
                    s.id === stakerId ? { ...s, [field]: value } : s
                );
                updateProjectMeta(activeProjectId, 'stakers', updatedStakers);
            };

            const results = useMemo(() => {
                let totalSparkHoursContributed = 0;
                const individualResults = activeProject.stakers.map(staker => {
                    const totalHours = (Number(staker.days) * 24) + Number(staker.hours);
                    const sparkHours = (Number(staker.sparklet) / 1000) * totalHours;
                    const payout = sparkHours * activeProject.upxPerHour;
                    totalSparkHoursContributed += sparkHours;
                    return { ...staker, sparkHours, payout };
                });

                const buildProgress = (totalSparkHoursContributed / activeProject.buildCostHours) * 100;
                const totalPayout = individualResults.reduce((acc, curr) => acc + curr.payout, 0);

                return {
                    individualResults,
                    totalSparkHoursContributed,
                    totalPayout,
                    buildProgress: Math.min(buildProgress, 100).toFixed(2)
                };
            }, [activeProject]);

            return (
                <div className="page-overlay flex flex-col md:flex-row">
                    {/* Sidebar: Projects List */}
                    <aside className="w-full md:w-80 bg-slate-950/90 backdrop-blur-2xl border-r border-slate-800/50 p-6 flex flex-col h-auto md:h-screen sticky top-0 z-20">
                        <div className="flex flex-col items-center mb-10 text-center">
                            <a href="portal.html" className="text-[10px] font-black text-blue-500/80 uppercase tracking-[0.2em] mb-4 hover:text-blue-400 transition-colors">← Back to Raytown Portal</a>
                            <img src="assets/images/FTPMlogo.png" alt="FastTrack PM Logo" className="w-32 h-32 mb-4 drop-shadow-[0_0_15px_rgba(59,130,246,0.5)]" />
                            <h1 className="racing-font text-xl font-bold tracking-widest text-white">FastTrack Project Manager</h1>
                        </div>

                        <div className="flex-1 overflow-y-auto custom-scroll space-y-2 pr-2">
                            <p className="text-[10px] font-black text-blue-500/80 uppercase tracking-[0.2em] mb-4 pl-2">Track & Garage</p>
                            {projects.map(p => (
                                <div 
                                    key={p.id}
                                    onClick={() => setActiveProjectId(p.id)}
                                    className={`group flex items-center justify-between p-4 rounded-2xl cursor-pointer transition-all border ${activeProjectId === p.id ? 'sidebar-item-active border-blue-500/30 shadow-lg shadow-blue-500/5' : 'border-transparent hover:bg-white/5 text-slate-400'}`}
                                >
                                    <div className="flex items-center gap-4 overflow-hidden">
                                        <div className={`p-2 rounded-lg transition-colors ${activeProjectId === p.id ? 'bg-blue-600 shadow-[0_0_10px_rgba(59,130,246,0.4)]' : 'bg-slate-800'}`}>
                                            <Icon name="folder" className="w-4 h-4 text-white" />
                                        </div>
                                        <div className="flex flex-col overflow-hidden">
                                            <span className="truncate text-sm font-bold">{p.name}</span>
                                            {activeProjectId === p.id && <span className="text-[10px] text-blue-300 font-medium">Currently Editing</span>}
                                        </div>
                                    </div>
                                    <div className="flex items-center gap-1">
                                        {activeProjectId === p.id && <Icon name="edit" className="w-3 h-3 text-blue-400 opacity-50" />}
                                        {projects.length > 1 && (
                                            <button 
                                                onClick={(e) => removeProject(p.id, e)}
                                                className="opacity-0 group-hover:opacity-100 p-2 hover:text-red-400 transition-opacity"
                                            >
                                                <Icon name="trash" className="w-4 h-4" />
                                            </button>
                                        )}
                                    </div>
                                </div>
                            ))}
                        </div>

                        <button 
                            onClick={addProject}
                            className="mt-6 flex items-center justify-center gap-2 w-full py-4 bg-blue-600 hover:bg-blue-500 text-white rounded-2xl font-bold transition-all shadow-lg shadow-blue-900/40 active:scale-95"
                        >
                            <Icon name="plus" className="w-5 h-5" /> New Construction
                        </button>
                    </aside>

                    {/* Main Content */}
                    <main className="flex-1 p-6 md:p-12 relative">
                        <div className="max-w-6xl mx-auto">
                            {/* Branding Hero Banner */}
                            <div className="mb-12 overflow-hidden rounded-[2.5rem] shadow-2xl relative border-4 border-slate-800/50 group">
                                <img src="assets/images/FTPMbanner1.png" className="w-full h-auto object-cover transform group-hover:scale-105 transition-transform duration-1000" alt="Workflow Banner" />
                                <div className="absolute inset-0 bg-gradient-to-t from-slate-900/95 via-transparent to-transparent flex flex-col justify-end p-8 md:p-12">
                                    <div className="group/input relative max-w-2xl">
                                        <input 
                                            type="text"
                                            value={activeProject.name}
                                            onChange={(e) => updateProjectMeta(activeProjectId, 'name', e.target.value)}
                                            placeholder="Enter Project Name..."
                                            className="bg-transparent border-b-2 border-blue-500/50 hover:border-blue-400 focus:border-white outline-none text-3xl md:text-5xl font-bold racing-font tracking-tight text-white transition-all w-full mb-2 placeholder-white/20"
                                        />
                                        <div className="absolute right-0 top-1/2 -translate-y-1/2 text-white/20 group-hover/input:text-white/50 transition-colors pointer-events-none">
                                            <Icon name="edit" className="w-6 h-6" />
                                        </div>
                                    </div>
                                    <div className="flex items-center gap-4">
                                        <div className="px-4 py-1.5 bg-blue-600 rounded-full text-[10px] font-black uppercase tracking-widest text-white shadow-lg">Active System</div>
                                        <p className="text-blue-300 font-bold text-sm">
                                            {activeProject.stakers.length} Dedicated Pit Crew Members
                                        </p>
                                    </div>
                                </div>
                            </div>

                            <div className="grid grid-cols-1 lg:grid-cols-12 gap-10">
                                {/* Left: Dash Controls */}
                                <div className="lg:col-span-4 space-y-8">
                                    <div className="glass-panel p-8 rounded-[2.5rem] shadow-2xl border-t-8 border-blue-600">
                                        <h2 className="text-xl font-bold mb-8 flex items-center gap-3 racing-font text-slate-800">
                                            <Icon name="info" className="text-blue-600 w-6 h-6" />
                                            Race Variables
                                        </h2>
                                        <div className="space-y-6">
                                            <div>
                                                <label className="block text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] mb-3">Project Title</label>
                                                <input 
                                                    type="text" 
                                                    value={activeProject.name} 
                                                    onChange={(e) => updateProjectMeta(activeProjectId, 'name', e.target.value)} 
                                                    className="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none font-bold text-slate-800" 
                                                />
                                            </div>
                                            <div>
                                                <label className="block text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] mb-3">Build Target (Spark Hours)</label>
                                                <input 
                                                    type="number" 
                                                    value={activeProject.buildCostHours} 
                                                    onChange={(e) => updateProjectMeta(activeProjectId, 'buildCostHours', e.target.value)} 
                                                    className="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none font-bold text-xl" 
                                                />
                                            </div>
                                            <div>
                                                <label className="block text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] mb-3">UPX Hourly Yield</label>
                                                <div className="relative">
                                                    <input 
                                                        type="number" 
                                                        value={activeProject.upxPerHour} 
                                                        onChange={(e) => updateProjectMeta(activeProjectId, 'upxPerHour', e.target.value)} 
                                                        className="w-full p-4 pl-14 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none font-bold text-xl text-blue-600" 
                                                    />
                                                    <div className="absolute left-5 top-5 text-blue-500"><Icon name="coins" className="w-6 h-6" /></div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Real-time Telemetry */}
                                    <div className="bg-slate-900 p-8 rounded-[2.5rem] shadow-2xl text-white border-b-8 border-blue-500 relative overflow-hidden">
                                        <h2 className="text-xl font-bold mb-8 racing-font text-blue-400">Construction Stats</h2>
                                        <div className="space-y-6">
                                            <div>
                                                <span className="text-slate-500 text-[10px] uppercase font-black tracking-[0.2em] block mb-2">Projected Total Purse</span>
                                                <span className="text-4xl font-bold racing-font text-white">{Math.round(results.totalPayout).toLocaleString()} <span className="text-sm font-normal text-blue-500">UPX</span></span>
                                            </div>
                                            <div className="pt-6 border-t border-slate-800 flex justify-between items-center">
                                                <span className="text-slate-500 text-[10px] font-black uppercase tracking-widest">Build Status</span>
                                                <span className="text-2xl font-bold text-blue-400">{results.buildProgress}%</span>
                                            </div>
                                            <div className="w-full bg-slate-800 rounded-full h-4 p-1">
                                                <div className="bg-gradient-to-r from-blue-700 to-blue-400 h-2 rounded-full shadow-[0_0_20px_rgba(59,130,246,0.6)] transition-all duration-700" style={{ width: `${results.buildProgress}%` }}></div>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                {/* Right: Pilots */}
                                <div className="lg:col-span-8 space-y-6">
                                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center px-4 gap-4">
                                        <h2 className="text-2xl font-bold racing-font text-white flex items-center gap-4">
                                            <div className="w-3 h-3 bg-blue-500 rounded-full"></div>
                                            The Pit Crew
                                        </h2>
                                        <div className="flex flex-wrap gap-2">
                                            <button 
                                                onClick={addStaker} 
                                                className="bg-blue-600 hover:bg-blue-500 text-white px-5 py-3 rounded-2xl font-bold text-xs transition-all flex items-center gap-2 shadow-lg shadow-blue-900/20"
                                            >
                                                <Icon name="plus" className="w-4 h-4" /> Add Pilot
                                            </button>
                                            <button 
                                                onClick={resetAllStakerTimes} 
                                                className="bg-slate-800 hover:bg-slate-700 text-slate-300 px-5 py-3 rounded-2xl font-bold text-xs border border-slate-700 transition-all flex items-center gap-2"
                                                title="Reset time for all pilots"
                                            >
                                                <Icon name="reset" className="w-4 h-4" /> Zero All Clocks
                                            </button>
                                            <button 
                                                onClick={clearAllStakers} 
                                                className="bg-red-950/30 hover:bg-red-900/40 text-red-400 px-5 py-3 rounded-2xl font-bold text-xs border border-red-900/50 transition-all flex items-center gap-2"
                                                title="Remove all pilots from project"
                                            >
                                                <Icon name="trash" className="w-4 h-4" /> Flush Garage
                                            </button>
                                        </div>
                                    </div>

                                    <div className="space-y-6">
                                        {activeProject.stakers.map((staker) => (
                                            <div key={staker.id} className="glass-panel p-6 md:p-10 rounded-[2.5rem] shadow-xl border-l-[12px] border-blue-600 hover:scale-[1.01] transition-all overflow-hidden relative group">
                                                <div className="grid grid-cols-1 md:grid-cols-12 gap-8 items-end relative z-10">
                                                    <div className="md:col-span-4">
                                                        <label className="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-3">Pilot Name</label>
                                                        <input 
                                                            type="text" 
                                                            value={staker.name} 
                                                            onChange={(e) => updateStaker(staker.id, 'name', e.target.value)} 
                                                            className="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none font-bold text-slate-900" 
                                                        />
                                                    </div>
                                                    <div className="md:col-span-3">
                                                        <label className="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-3">Sparklet Input</label>
                                                        <input 
                                                            type="number" 
                                                            value={staker.sparklet} 
                                                            onChange={(e) => updateStaker(staker.id, 'sparklet', e.target.value)} 
                                                            className="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none font-bold text-blue-600" 
                                                        />
                                                    </div>
                                                    <div className="md:col-span-4">
                                                        <label className="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-3">Staking Time</label>
                                                        <div className="flex gap-3">
                                                            <div className="relative flex-1">
                                                                <input type="number" value={staker.days} onChange={(e) => updateStaker(staker.id, 'days', e.target.value)} className="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none font-bold text-slate-700 pr-10" />
                                                                <span className="absolute right-4 top-4.5 text-[10px] font-black text-slate-300">D</span>
                                                            </div>
                                                            <div className="relative flex-1">
                                                                <input type="number" value={staker.hours} onChange={(e) => updateStaker(staker.id, 'hours', e.target.value)} className="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none font-bold text-slate-700 pr-10" />
                                                                <span className="absolute right-4 top-4.5 text-[10px] font-black text-slate-300">H</span>
                                                            </div>
                                                        </div>
                                                    </div>
                                                    <div className="md:col-span-1 flex flex-col gap-2 justify-end pb-1">
                                                        <button 
                                                            onClick={() => resetStakerTime(staker.id)} 
                                                            className="p-3 text-slate-300 hover:text-blue-500 hover:bg-blue-50 rounded-2xl transition-all"
                                                            title="Clear payment (reset service time)"
                                                        >
                                                            <Icon name="reset" className="w-5 h-5" />
                                                        </button>
                                                        <button 
                                                            onClick={() => removeStaker(staker.id)} 
                                                            className="p-3 text-slate-300 hover:text-red-500 hover:bg-red-50 rounded-2xl transition-all"
                                                            title="Remove Pilot"
                                                        >
                                                            <Icon name="trash" className="w-5 h-5" />
                                                        </button>
                                                    </div>
                                                </div>

                                                <div className="mt-10 pt-8 border-t border-slate-100 flex flex-col sm:flex-row justify-between items-center gap-8">
                                                    <div className="flex gap-6">
                                                        <div>
                                                            <span className="text-[10px] font-black text-slate-400 uppercase tracking-widest block mb-1">Work Output</span>
                                                            <span className="font-bold text-slate-900 bg-slate-100 px-4 py-2 rounded-xl text-sm border border-slate-200 block">
                                                                {results.individualResults.find(r => r.id === staker.id)?.sparkHours.toFixed(2)} Spark Hours
                                                            </span>
                                                        </div>
                                                    </div>
                                                    
                                                    <div className="w-full sm:w-auto bg-slate-900 px-10 py-5 rounded-[2rem] shadow-2xl border-b-8 border-green-500 flex flex-col items-center sm:items-end">
                                                        <span className="text-[10px] font-black text-blue-400 uppercase tracking-[0.2em] mb-1">Estimated Payout</span>
                                                        <span className="text-4xl font-bold text-white racing-font">
                                                            {Math.round(results.individualResults.find(r => r.id === staker.id)?.payout || 0).toLocaleString()} <span className="text-sm font-normal text-slate-400 opacity-50">UPX</span>
                                                        </span>
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                            
                            <footer className="mt-24 pb-16 flex flex-col items-center">
                                <img src="assets/images/fasttracktoolslogo.png" alt="FastTrack Tools Logo" className="w-48 h-auto mb-8 drop-shadow-xl" />
                                <div className="h-px w-32 bg-slate-800 mb-8 opacity-50"></div>
                                <p className="font-bold racing-font tracking-[0.4em] text-slate-600 text-[10px]">FastTrack Tools • Precision Management</p>
                                <p className="text-slate-700 text-[10px] mt-2 font-medium">Empowering Creators through Data-Driven Engineering</p>
                            </footer>
                        </div>
                    </main>
                </div>
            );
        };

        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>
